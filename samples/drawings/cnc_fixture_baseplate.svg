  <text x="32" y="66" fill="#94a3b8" font-family="monospace" font-size="11">PART: FXP-240-180-16  |  MATERIAL: Al 7075-T6  |  SCALE: 1:2  |  FINISH: hard anodize Type III</text>
  <text x="32" y="84" fill="#64748b" font-family="monospace" font-size="10">FEATURES: rectangular plate, center bore, 4x corner holes, slotted clamp pockets (visual)</text>

