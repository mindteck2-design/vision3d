  <text x="20" y="48" fill="#94a3b8" font-family="monospace" font-size="11">PART: BUSH-60-30  |  SCALE: 1:1</text>

  <g transform="translate(220, 220)">
    <rect x="-90" y="-40" width="60" height="80" fill="#e2e8f0" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-30" y="-55" width="70" height="110" fill="#cbd5e1" stroke="#38bdf8" stroke-width="2"/>
    <rect x="40" y="-30" width="50" height="60" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-15" y="-55" width="30" height="110" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-dasharray="4 2"/>
