<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760">
  <defs>
    <pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#475569" stroke-width="0.9"/>
    </pattern>
    <pattern id="grid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1e293b" stroke-width="0.35"/>
    </pattern>
  </defs>

  <rect width="1080" height="760" fill="#070b14"/>
  <rect width="1080" height="760" fill="url(#grid2)" opacity="0.5"/>
  <rect x="10" y="10" width="1060" height="740" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <text x="32" y="44" fill="#22d3ee" font-family="monospace" font-size="17" font-weight="bold">DUAL-FLANGE COUPLING HUB - UNITS: MM</text>
  <text x="32" y="66" fill="#94a3b8" font-family="monospace" font-size="11">PART: CFH-180-60  |  MATERIAL: C45N  |  SCALE: 1:1.5  |  HEAT TREAT: normalize + temper</text>
  <text x="32" y="84" fill="#64748b" font-family="monospace" font-size="10">FEATURES: drive flange, driven flange, stepped hub, through bore, 8x PCD bolts, chamfer notes</text>

  <g transform="translate(300, 340)">
    <text x="-200" y="-200" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">SIDE ELEVATION</text>
    <rect x="-170" y="-20" width="40" height="200" fill="#f8fafc" stroke="#22d3ee" stroke-width="2"/>
    <rect x="-130" y="20" width="200" height="120" fill="#e2e8f0" stroke="#22d3ee" stroke-width="2"/>
    <rect x="70" y="0" width="36" height="160" fill="#cbd5e1" stroke="#22d3ee" stroke-width="2"/>
    <rect x="-170" y="55" width="276" height="50" fill="url(#hatch2)" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-170" y1="-20" x2="-155" y2="-5" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="106" y1="0" x2="90" y2="16" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="-190" y1="80" x2="130" y2="80" stroke="#ef4444" stroke-width="1" stroke-dasharray="10 4 2 4"/>
    <text x="-150" y="-35" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">Outer flange  &#216; 180.00 mm</text>
    <text x="-40" y="10" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">Barrel  &#216; 120.00 mm</text>
    <text x="90" y="-15" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">Pilot  &#216; 95.00 mm</text>
    <text x="-40" y="175" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">Bore  &#216; 60.00 mm</text>
    <text x="-40" y="195" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">Height  95.00 mm</text>
    <text x="-210" y="100" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">Flange thick  20.00 mm</text>
  </g>

  <g transform="translate(720, 250)">
    <text x="-80" y="-145" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">FLANGE FACE A</text>
    <circle cx="0" cy="0" r="110" fill="#e2e8f0" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="72" fill="#cbd5e1" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="36" fill="#070b14" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
    <g fill="#070b14" stroke="#22d3ee" stroke-width="1.5">
      <circle cx="90" cy="0" r="6"/><circle cx="63.6" cy="63.6" r="6"/>
      <circle cx="0" cy="90" r="6"/><circle cx="-63.6" cy="63.6" r="6"/>
      <circle cx="-90" cy="0" r="6"/><circle cx="-63.6" cy="-63.6" r="6"/>
      <circle cx="0" cy="-90" r="6"/><circle cx="63.6" cy="-63.6" r="6"/>
    </g>
    <text x="0" y="140" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Bolt pattern PCD &#216; 150</text>
    <text x="130" y="0" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">Bolt holes  &#216; 11.00 mm x 8</text>
  </g>

  <g transform="translate(620, 430)">
    <rect x="0" y="0" width="400" height="100" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">NOTES</text>
    <text x="12" y="42" fill="#94a3b8" font-family="monospace" font-size="10">1. Break all sharp edges 0.3 x 45 deg unless noted</text>
    <text x="12" y="58" fill="#94a3b8" font-family="monospace" font-size="10">2. Flange faces flatness 0.05 mm; runout 0.04 mm max</text>
    <text x="12" y="74" fill="#94a3b8" font-family="monospace" font-size="10">3. Deburr bolt holes; countersink 0.5 x 45 deg both sides</text>
    <text x="12" y="90" fill="#94a3b8" font-family="monospace" font-size="10">4. Magnetic particle inspect after heat treat</text>
  </g>

  <g transform="translate(32, 500)">
    <rect x="0" y="0" width="360" height="220" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="22" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">DIMENSIONS (READABLE)</text>
    <text x="12" y="48" fill="#e2e8f0" font-family="monospace" font-size="12">Outer flange     &#216; 180.00 mm</text>
    <text x="12" y="68" fill="#e2e8f0" font-family="monospace" font-size="12">Barrel           &#216; 120.00 mm</text>
    <text x="12" y="88" fill="#e2e8f0" font-family="monospace" font-size="12">Pilot            &#216; 95.00 mm</text>
    <text x="12" y="108" fill="#e2e8f0" font-family="monospace" font-size="12">Bore             &#216; 60.00 mm</text>
    <text x="12" y="128" fill="#e2e8f0" font-family="monospace" font-size="12">Height           95.00 mm</text>
    <text x="12" y="148" fill="#e2e8f0" font-family="monospace" font-size="12">Flange thick     20.00 mm</text>
    <text x="12" y="168" fill="#e2e8f0" font-family="monospace" font-size="12">Bolt pattern PCD &#216; 150</text>
    <text x="12" y="188" fill="#e2e8f0" font-family="monospace" font-size="12">Bolt holes       &#216; 11.00 mm x 8</text>
    <text x="12" y="208" fill="#64748b" font-family="monospace" font-size="11">Chamfer notes are visual only</text>
  </g>

  <g transform="translate(720, 560)">
    <rect x="0" y="0" width="300" height="140" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="28" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold">COUPLING FAMILY - CFH</text>
    <text x="12" y="52" fill="#94a3b8" font-family="monospace" font-size="10">DWG: CFH-180-60</text>
    <text x="12" y="72" fill="#94a3b8" font-family="monospace" font-size="10">PART: dual flange hub</text>
    <text x="12" y="92" fill="#94a3b8" font-family="monospace" font-size="10">SCALE: 1:1.5   REV: B</text>
    <text x="12" y="112" fill="#94a3b8" font-family="monospace" font-size="10">CLIENT DEMO SHEET</text>
    <text x="12" y="130" fill="#64748b" font-family="monospace" font-size="9">Upload in Vision3D for live parametric CAD</text>
  </g>
</svg>
